<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="text-center">
        <h1 class="text-5xl font-bold text-blue-600 mb-4">Hello World</h1>
        <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
            Click Me
        </button>
    </div>

<!-- Correct way to have button -->

<button class="px-4 py-2 bg-blue-500 text-white">
  Submit
</button>

<!-- Incorrect way to have button -->
<button class="px-4 py-2 bg-blue-500 text-white">
  <a href="#">Submit</a>
</button>

<div class="px-4 py-2 bg-blue-500 text-white">
    Submit
</div>


</body>
</html>
